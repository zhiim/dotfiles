# A single dispatcher handles IS_NVIM and manual navigation locks.
# Ctrl+0 toggles the whole tab; Alt+0 toggles only the current window.
map alt+0 kitten key_mappings.py toggle
map ctrl+0 kitten key_mappings.py toggle-window
map ctrl+h kitten key_mappings.py move h
map ctrl+j kitten key_mappings.py move j
map ctrl+k kitten key_mappings.py move k
map ctrl+l kitten key_mappings.py move l
map alt+h kitten key_mappings.py resize h
map alt+j kitten key_mappings.py resize j
map alt+k kitten key_mappings.py resize k
map alt+l kitten key_mappings.py resize l

# smart-splits.nvim v2.1.1 uses KITTY_LISTEN_ON for detection and callbacks.
# Linux: a per-process socket inside the user's private runtime directory.
# No TCP listener or remote control over terminal escape sequences.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-smart-splits-{kitty_pid}
