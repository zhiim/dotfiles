# font family
font_family JetBrainsMono Nerd Font
font_size 12.0

# Set widows size at starup
remember_window_size  no
initial_window_width  120c
initial_window_height 30c

# How many lines of scrollback you want to retain per tab
scrollback_lines 3500

# Theme: change the filename to select a color scheme.
# Available: catppuccin, everforest, github, kanagawa, nightfox,
#            nordic, onedark, onenord, tokyonight
include colors/catppuccin.conf

# Theme-aware tabs and status bar.
include tab.conf

# Keyboard mappings
include mappings.conf
include smart_split.conf
