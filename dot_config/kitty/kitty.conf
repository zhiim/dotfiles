# font family
font_family JetBrainsMono Nerd Font
font_size 12.0
symbol_map U+3400-U+4DBF,U+4E00-U+9FFF,U+F900-U+FAFF,U+20000-U+2FFFF,U+30000-U+3FFFF Noto Sans CJK SC
symbol_map U+3000-U+303F,U+FE10-U+FE1F,U+FE30-U+FE4F,U+FF00-U+FFEF Noto Sans CJK SC

# Set widows size at starup
remember_window_size  no
initial_window_width  120c
initial_window_height 30c

# How many lines of scrollback you want to retain per tab
scrollback_lines 3500

# Theme: change the filename to select a color scheme.
# Available: catppuccin, everforest, github, kanagawa, nightfox,
#            nordic, onedark, onenord, tokyonight
include colors/catppuccin.conf

# Theme-aware tabs and status bar.
include tab.conf

# Show per-window lock markers when at least two panes are visible.
window_title_bar top
window_title_bar_min_windows 2
window_title_template "{custom}{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.window}{progress_percent}{title}"

# Keyboard mappings
include mappings.conf
include smart_split.conf
