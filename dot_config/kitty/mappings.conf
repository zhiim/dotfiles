# One-shot Alt+B leader, consumed by Kitty and cancelled after one second.
map --new-mode leader --on-unknown passthrough_and_end --on-action end --timeout 1.0 alt+b

map --mode leader l command_palette

# Tabs and panes. Explicit close confirmation is preserved.
map --mode leader c new_tab_with_cwd
map --mode leader shift+x kitten key_mappings.py close-tab
map --mode leader x close_window_with_confirmation
map --mode leader n next_tab
map --mode leader p previous_tab

# SplitVertical creates top/bottom panes; SplitHorizontal left/right.
map --mode leader = combine : goto_layout splits : launch --location=hsplit --cwd=current
map --mode leader - combine : goto_layout splits : launch --location=vsplit --cwd=current

map --mode leader 1 goto_tab 1
map --mode leader 2 goto_tab 2
map --mode leader 3 goto_tab 3
map --mode leader 4 goto_tab 4
map --mode leader 5 goto_tab 5
map --mode leader 6 goto_tab 6
map --mode leader 7 goto_tab 7
map --mode leader 8 goto_tab 8
map --mode leader 9 goto_tab 9
